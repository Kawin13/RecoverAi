services:
  # 1. RecoverAI Production Web Service
  - type: web
    name: recoverai-web
    runtime: python
    buildCommand: "pip install -r backend/requirements.txt"
    preDeployCommand: "cd backend && alembic upgrade head"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: RUN_BACKGROUND_WORKER
        value: "false"
      - key: SEED_DEMO_DATA
        value: "false"
      - key: USE_SQLITE
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: APP_ENCRYPTION_KEY
        sync: false
      - key: FRONTEND_PUBLIC_URL
        value: "https://recover-ai-rho-steel.vercel.app"
      - key: CORS_ORIGINS
        value: "https://recover-ai-rho-steel.vercel.app,http://localhost:3000"
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_WEBHOOK_SECRET
        sync: false
      - key: EMAIL_ENABLED
        value: "true"
      - key: EMAIL_FROM_ADDRESS
        value: "RecoverAI <onboarding@resend.dev>"
      - key: EMAIL_TEST_MODE
        value: "false"
      - key: EMAIL_AUTO_REDIRECT_DEMO
        value: "false"
      - key: EMAIL_TEST_RECIPIENTS
        sync: false
      # Gmail SMTP Fallback (delivers directly to ANY customer email)
      - key: SMTP_HOST
        value: "smtp.gmail.com"
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        value: "kawindharmaraj@gmail.com"
      - key: SMTP_PASSWORD
        value: "vttz ioyt ceob rvcq"
      - key: SMTP_FROM_ADDRESS
        value: "RecoverAI <kawindharmaraj@gmail.com>"
      - key: SMTP_USE_TLS
        value: "true"


  - type: worker
    name: recoverai-worker
    runtime: python
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && python -m app.worker"
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: RUN_BACKGROUND_WORKER
        value: "true"
      - key: SEED_DEMO_DATA
        value: "false"
      - key: USE_SQLITE
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: APP_ENCRYPTION_KEY
        sync: false
      - key: FRONTEND_PUBLIC_URL
        value: "https://recover-ai-rho-steel.vercel.app"
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_WEBHOOK_SECRET
        sync: false
      - key: EMAIL_ENABLED
        value: "true"
      - key: EMAIL_FROM_ADDRESS
        value: "RecoverAI <onboarding@resend.dev>"
      - key: EMAIL_TEST_MODE
        value: "false"
      - key: EMAIL_AUTO_REDIRECT_DEMO
        value: "false"
      - key: EMAIL_TEST_RECIPIENTS
        sync: false
      # Gmail SMTP Fallback (delivers directly to ANY customer email)
      - key: SMTP_HOST
        value: "smtp.gmail.com"
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        value: "kawindharmaraj@gmail.com"
      - key: SMTP_PASSWORD
        value: "vttz ioyt ceob rvcq"
      - key: SMTP_FROM_ADDRESS
        value: "RecoverAI <kawindharmaraj@gmail.com>"
      - key: SMTP_USE_TLS
        value: "true"
